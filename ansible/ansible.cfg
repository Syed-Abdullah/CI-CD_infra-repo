# =============================================================================
# ANSIBLE CONFIGURATION
# =============================================================================
# This file controls Ansible's global behavior. It's automatically read when
# you run ansible-playbook from this directory.
# =============================================================================

[defaults]
# Path to our inventory file (the list of servers to manage)
inventory = inventory.ini

# SSH user — Ubuntu EC2 instances use "ubuntu" as the default user
remote_user = ubuntu

# The private key file for SSH authentication.
# CHANGE THIS to the path of YOUR .pem file on your local machine.
private_key_file = ~/.ssh/my-ec2-keypair.pem

# Don't prompt to verify SSH host keys on first connection.
# Fine for demo/dev; in production you'd want strict host key checking.
host_key_checking = False

# Reduce noisy output — show only changes and errors
# Options: 0 (minimal) to 4 (maximum debug)
# stdout_callback = yaml

# How many servers to configure in parallel (we only have 2, so 5 is plenty)
forks = 5

# Timeout in seconds for SSH connections
timeout = 30

[privilege_escalation]
# Most installation tasks need root privileges (apt install, systemctl, etc.)
# This tells Ansible to use "sudo" automatically for those tasks.
become = True
become_method = sudo
become_user = root
become_ask_pass = False
