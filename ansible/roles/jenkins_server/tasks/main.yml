# =============================================================================
# JENKINS SERVER ROLE — Main Tasks
# =============================================================================
# This role installs Docker and Jenkins on the Jenkins server.
#
# What each section does (in order):
#   1. Install prerequisite packages (apt-transport-https, curl, etc.)
#   2. Install Docker CE from Docker's official repository
#   3. Install Jenkins LTS from Jenkins' official repository
#   4. Add the 'jenkins' user to the 'docker' group so Jenkins can build images
#   5. Start and enable both services
#   6. Print where to find the Jenkins initial admin password
# =============================================================================

---
# ============================================================
# STEP 1: Update apt cache and install prerequisites
# ============================================================
# These packages are needed to add external apt repositories (Docker, Jenkins).
# - apt-transport-https: allows apt to use HTTPS repos
# - ca-certificates: SSL certificate bundle for verifying HTTPS connections
# - curl: command-line tool to download GPG keys
# - gnupg: GNU Privacy Guard, needed to verify repo signing keys
# - software-properties-common: provides add-apt-repository command
# ============================================================
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600  # Don't re-update if cache is less than 1 hour old

- name: Install prerequisite packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
      - git                 # Required by Jenkins for SCM checkouts in pipelines
      - fontconfig          # Required by Jenkins (Java font rendering)
      - openjdk-21-jre      # Jenkins requires Java 21+
    state: present

# ============================================================
# STEP 2: Install Docker CE (Community Edition)
# ============================================================
# We install Docker from Docker's OFFICIAL repository, not Ubuntu's.
# Ubuntu's docker.io package is often outdated. Docker's repo gives us
# the latest stable version.
#
# The process:
#   1. Download Docker's GPG key (proves the packages are legit)
#   2. Add Docker's apt repository
#   3. Install docker-ce (the engine), docker-ce-cli (the CLI tool),
#      and containerd.io (the container runtime)
# ============================================================
- name: Add Docker GPG key
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg  # Skip if key already exists

- name: Add Docker apt repository
  shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  args:
    creates: /etc/apt/sources.list.d/docker.list

- name: Update apt cache after adding Docker repo
  apt:
    update_cache: yes

- name: Install Docker CE
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes  # Start automatically on boot

# ============================================================
# STEP 3: Install Jenkins (LTS — Long Term Support)
# ============================================================
# We install Jenkins from its OFFICIAL apt repository.
# Jenkins LTS releases are stable and well-tested.
#
# The process:
#   1. Download Jenkins' GPG key
#   2. Add Jenkins' apt repository
#   3. Install jenkins package
#   4. Start and enable the Jenkins service
#
# Official install docs: https://www.jenkins.io/doc/book/installing/linux/
# ============================================================
- name: Add Jenkins GPG key
  shell: |
    curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key | tee /usr/share/keyrings/jenkins-keyring.asc > /dev/null
  args:
    creates: /usr/share/keyrings/jenkins-keyring.asc

- name: Add Jenkins apt repository
  shell: |
    echo "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/" > /etc/apt/sources.list.d/jenkins.list
  args:
    creates: /etc/apt/sources.list.d/jenkins.list

- name: Update apt cache after adding Jenkins repo
  apt:
    update_cache: yes

- name: Install Jenkins
  apt:
    name: jenkins
    state: present

- name: Start and enable Jenkins service
  systemd:
    name: jenkins
    state: started
    enabled: yes

# ============================================================
# STEP 4: Add Jenkins user to Docker group
# ============================================================
# By default, Docker commands require root privileges. Instead of
# running Jenkins as root (dangerous!), we add the 'jenkins' user
# to the 'docker' group. This lets Jenkins run docker build, docker push,
# etc. without sudo.
#
# NOTE: The Jenkins service must be restarted for this to take effect.
# ============================================================
- name: Add 'jenkins' user to 'docker' group
  user:
    name: jenkins
    groups: docker
    append: yes  # APPEND to existing groups, don't replace them

- name: Add 'ubuntu' user to 'docker' group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Restart Jenkins to pick up Docker group membership
  systemd:
    name: jenkins
    state: restarted

# ============================================================
# STEP 5: Print Jenkins initial admin password location
# ============================================================
# When Jenkins starts for the first time, it generates a random password
# and stores it in a file. You need this password to unlock the Jenkins
# web UI on first visit.
# ============================================================
- name: Wait for Jenkins to generate initial admin password
  wait_for:
    path: /var/lib/jenkins/secrets/initialAdminPassword
    state: present
    timeout: 120  # Wait up to 2 minutes

- name: Read Jenkins initial admin password
  command: cat /var/lib/jenkins/secrets/initialAdminPassword
  register: jenkins_password
  changed_when: false  # This is a read-only command, not a change

- name: Display Jenkins initial admin password
  debug:
    msg: |
      ============================================================
      JENKINS INITIAL ADMIN PASSWORD
      ============================================================
      Password: {{ jenkins_password.stdout }}

      Access Jenkins at: http://<JENKINS_EIP>:8080
      File location: /var/lib/jenkins/secrets/initialAdminPassword
      ============================================================
