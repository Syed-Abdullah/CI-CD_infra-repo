# =============================================================================
# ANSIBLE INVENTORY
# =============================================================================
# This file tells Ansible WHICH servers to connect to and HOW.
#
# After running `terraform apply`, copy the Elastic IPs from the output:
#   jenkins_eip = "X.X.X.X"
#   kind_eip    = "Y.Y.Y.Y"
#
# Then replace the placeholder IPs below with the actual values.
# =============================================================================

# ---------------------------------------------------------------------------
# Jenkins Server Group
# ---------------------------------------------------------------------------
# Servers in this group will receive the Jenkins + Docker installation.
# Replace the IP below with the jenkins_eip output from Terraform.
# ---------------------------------------------------------------------------
[jenkins_server]
100.60.100.226

# ---------------------------------------------------------------------------
# Kind Cluster Group
# ---------------------------------------------------------------------------
# Servers in this group will receive Docker + kubectl + kind installation.
# Replace the IP below with the kind_eip output from Terraform.
# ---------------------------------------------------------------------------
[kind_cluster]
100.48.198.37

# ---------------------------------------------------------------------------
# Group Variables — applies to ALL servers above
# ---------------------------------------------------------------------------
# ansible_user: The SSH username (Ubuntu AMIs use "ubuntu")
# ansible_ssh_private_key_file: Path to your .pem key file
# ansible_python_interpreter: Explicitly set Python path to avoid warnings
# ---------------------------------------------------------------------------
[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/jenkinskey.pem
ansible_python_interpreter=/usr/bin/python3
